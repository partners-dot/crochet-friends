<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Got You a Little Something - Personalized Video</title>
  <meta name="description" content="Create a personalized video message from your crocheted friend!">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Deep Blue & Warm Gold Palette */
      --bg-primary: #050A30;
      --bg-secondary: #000080;
      --card-bg: rgba(255, 255, 255, 0.1);
      --text-primary: #FFFFFF;
      --text-secondary: rgba(255, 255, 255, 0.8);
      
      /* Warm Gold Accents */
      --accent-neon: #FFD166; 
      --accent-hover: #FFE082;
      
      --border-color: rgba(255, 255, 255, 0.2);
      
      /* Softer Glow */
      --glow: 0 0 10px rgba(255, 209, 102, 0.5), 0 0 20px rgba(255, 209, 102, 0.3);
      
      --radius-sm: 1rem;
      --radius-lg: 1.5rem;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Outfit', sans-serif; 
      background-color: var(--bg-primary);
      min-height: 100vh; 
      color: var(--text-primary); 
      padding: 2rem 1rem;
      background-image: linear-gradient(180deg, #050A30 0%, #000080 100%);
    }
    .container { max-width: 480px; margin: 0 auto; }
    
    header { text-align: center; padding: 1rem 0 2rem; animation: fadeIn 0.8s ease-out; }
    
    h1 { 
      font-size: 2.5rem; 
      font-weight: 700; 
      color: var(--accent-neon);
      margin-bottom: 0.5rem; 
      line-height: 1.1;
      text-transform: uppercase;
      text-shadow: var(--glow);
    }
    
    .subtitle {
      font-size: 1.2rem;
      color: #FFF;
      font-weight: 600;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .tagline { 
      font-family: 'Dancing Script', cursive;
      color: #FFF; 
      font-size: 2rem;
      margin-top: 0.5rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .card { 
      background: var(--card-bg); 
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: var(--radius-lg); 
      padding: 2rem; 
      margin-bottom: 1.5rem; 
      border: 1px solid var(--border-color); 
      transition: transform 0.3s;
    }
    .card:hover { transform: translateY(-2px); border-color: var(--accent-neon); }
    
    label { display: block; font-weight: 600; margin-bottom: 0.75rem; color: var(--text-primary); font-size: 0.95rem; letter-spacing: 0.5px; }
    
    textarea { 
      width: 100%; 
      padding: 1.25rem; 
      border: 2px solid var(--border-color); 
      border-radius: var(--radius-sm); 
      background: rgba(0, 0, 0, 0.2); 
      color: #FFF; 
      font-family: inherit; 
      font-size: 1rem; 
      resize: none; 
      transition: all 0.2s; 
    }
    textarea:focus { 
      outline: none; 
      border-color: var(--accent-neon); 
      box-shadow: 0 0 15px rgba(255, 209, 102, 0.3); 
    }
    textarea::placeholder { color: rgba(255, 255, 255, 0.5); }
    
    .char-count { text-align: right; font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.5rem; }
    
    .products { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-top: 1rem; }
    .product { 
      background: rgba(255, 255, 255, 0.05); 
      border: 2px solid var(--border-color); 
      border-radius: var(--radius-sm); 
      padding: 1rem 0.5rem; 
      text-align: center; 
      cursor: pointer; 
      transition: all 0.2s; 
      position: relative; 
    }
    .product:hover { border-color: var(--accent-neon); transform: translateY(-2px); box-shadow: 0 0 10px rgba(255, 209, 102, 0.2); }
    .product.selected { 
      border-color: var(--accent-neon); 
      background: rgba(255, 209, 102, 0.1); 
      box-shadow: 0 0 15px rgba(255, 209, 102, 0.3);
    }
    .product.selected::after { 
      content: '✓'; 
      position: absolute; 
      top: 0.25rem; 
      right: 0.25rem; 
      background: var(--accent-neon); 
      color: #050A30; 
      width: 20px; 
      height: 20px; 
      border-radius: 50%; 
      font-size: 12px; 
      font-weight: bold;
      display: flex; 
      align-items: center; 
      justify-content: center; 
    }
    .product-img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; margin-bottom: 0.75rem; border: 2px solid #FFF; background: white; }
    .product-emoji { font-size: 2.5rem; margin-bottom: 0.25rem; display: block; }
    .product-name { font-size: 0.85rem; font-weight: 600; color: #FFF; }
    
    .btn { width: 100%; padding: 1.25rem; border: none; border-radius: 50px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: all 0.3s; font-family: inherit; text-transform: uppercase; letter-spacing: 1px; }
    .btn-primary { 
      background: var(--accent-neon); 
      color: #050A30; 
      box-shadow: var(--glow); 
    }
    .btn-primary:hover { 
      background: #FFF; 
      transform: translateY(-2px); 
      box-shadow: 0 0 20px #FFF; 
    }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
    
    .btn-secondary { background: transparent; color: #FFF; border: 2px solid #FFF; margin-top: 1rem; }
    .btn-secondary:hover { border-color: var(--accent-neon); color: var(--accent-neon); background: rgba(255,209,102,0.1); }
    
    video { width: 100%; border-radius: var(--radius-sm); background: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 1.5rem; border: 2px solid var(--accent-neon); }
    
    .loading { text-align: center; padding: 3rem 1.5rem; }
    .spinner { width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.3); border-top-color: var(--accent-neon); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1.5rem; box-shadow: 0 0 15px var(--accent-neon); }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .progress-text { color: var(--text-secondary); font-size: 0.95rem; margin-top: 0.75rem; }
    .error { background: rgba(255, 0, 0, 0.1); padding: 1.5rem; border-radius: var(--radius-sm); color: #FF6B6B; text-align: center; border: 1px solid #FF6B6B; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="subtitle">Thanks for choosing</div>
      <h1>Got You A<br>Little<br>Something</h1>
      <p class="tagline">Send a personalized video from our cute crochet!</p>
    </header>
    <form id="form">
      <div class="card">
        <label for="message">YOUR MESSAGE</label>
        <textarea id="message" rows="4" maxlength="200" placeholder="Happy Birthday! I hope this little friend makes you smile!" required></textarea>
        <div class="char-count"><span id="charCount">0</span>/200</div>
      </div>
      <div class="card">
        <label>CHOOSE YOUR FRIEND</label>
        <div class="products" id="products">
          <div class="product selected" data-product="potato">
            <img src="images/potato.jpg" alt="Potato" class="product-img" onerror="this.outerHTML='<div class=product-emoji>🥔</div>'">
            <div class="product-name">Potato</div>
          </div>
          <div class="product" data-product="avocado">
            <div class="product-emoji">🥑</div>
            <div class="product-name">Avocado</div>
          </div>
          <div class="product" data-product="strawberry">
            <div class="product-emoji">🍓</div>
            <div class="product-name">Strawberry</div>
          </div>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" id="generateBtn">✨ Create Video Message</button>
    </form>
    <div id="loading" class="card hidden">
      <div class="loading">
        <div class="spinner"></div>
        <p style="font-weight: 600;">Creating your magical video...</p>
        <p class="progress-text" id="progressText">This takes about 20-30 seconds</p>
      </div>
    </div>
    <div id="result" class="card hidden">
      <video id="video" controls playsinline autoplay></video>
      <a id="downloadBtn" class="btn btn-primary" style="display:block; text-align:center; text-decoration:none; margin-top:1rem;">📥 Download Video</a>
      <button type="button" class="btn btn-secondary" onclick="reset()">Create Another</button>
    </div>
    <div id="error" class="card error hidden">
      <p id="errorText">Oops! Something went wrong. Please try again.</p>
      <button type="button" class="btn btn-secondary" onclick="reset()">Try Again</button>
    </div>
  </div>
  <script>
    const form = document.getElementById('form');
    const message = document.getElementById('message');
    const charCount = document.getElementById('charCount');
    const progressText = document.getElementById('progressText');
    const products = document.querySelectorAll('.product');
    let selectedProduct = 'potato';
    message.addEventListener('input', () => charCount.textContent = message.value.length);
    products.forEach(p => p.addEventListener('click', () => {
      products.forEach(x => x.classList.remove('selected'));
      p.classList.add('selected');
      selectedProduct = p.dataset.product;
    }));
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = message.value.trim();
      if (!text) return;
      document.getElementById('form').classList.add('hidden');
      document.getElementById('loading').classList.remove('hidden');
      progressText.textContent = 'Starting video generation...';
      try {
        const startRes = await fetch('/api/generate-video', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, character: selectedProduct })
        });
        const startData = await startRes.json();
        if (!startRes.ok) throw new Error(startData.error || 'Failed to start generation');
        const operationId = startData.operationId;
        console.log('Generation started, operationId:', operationId);
        progressText.textContent = 'Video is being created...';
        let videoUrl = null;
        let attempts = 0;
        const maxAttempts = 60;
        while (!videoUrl && attempts < maxAttempts) {
          await new Promise(r => setTimeout(r, 5000));
          attempts++;
          progressText.textContent = `Creating magic... (${attempts * 5}s)`;
          const statusRes = await fetch(`/api/check-status?operationId=${encodeURIComponent(operationId)}`);
          const statusData = await statusRes.json();
          if (!statusRes.ok) { console.error('Status check failed:', statusData); continue; }
          if (statusData.status === 'done') { videoUrl = statusData.videoUrl; }
          else if (statusData.status === 'error') { throw new Error(statusData.error || 'Video generation failed'); }
        }
        if (!videoUrl) { throw new Error('Video generation timed out after 5 minutes'); }
        document.getElementById('video').src = videoUrl;
        document.getElementById('downloadBtn').href = videoUrl;
        document.getElementById('downloadBtn').download = `crochet-${selectedProduct}-message.mp4`;
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('result').classList.remove('hidden');
      } catch (err) {
        console.error(err);
        document.getElementById('errorText').textContent = err.message || 'Something went wrong. Please try again.';
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('error').classList.remove('hidden');
      }
    });
    function reset() {
      ['loading', 'result', 'error'].forEach(id => document.getElementById(id).classList.add('hidden'));
      document.getElementById('form').classList.remove('hidden');
    }
  </script>
</body>
</html>
