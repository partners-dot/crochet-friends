<!DOCTYPE html>

<html lang="en">



<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Crochet Friends - Personalized Video Messages</title>

  <meta name="description" content="Create a personalized video message from your crocheted friend!">

  <style>

    :root {

      --bg: #1a1625;

      --card: #2a2438;

      --accent: #ff6b9d;

      --accent2: #c44569;

      --text: #f5f5f5;

      --muted: #a0a0a0;

    }



    * {

      box-sizing: border-box;

      margin: 0;

      padding: 0;

    }



    body {

      font-family: 'Segoe UI', system-ui, sans-serif;

      background: linear-gradient(135deg, var(--bg), #2d1f3d);

      min-height: 100vh;

      color: var(--text);

      padding: 1rem;

    }



    .container {

      max-width: 420px;

      margin: 0 auto;

    }



    header {

      text-align: center;

      padding: 2rem 0;

    }



    .logo {

      font-size: 2.5rem;

      margin-bottom: 0.5rem;

    }



    h1 {

      font-size: 1.5rem;

      background: linear-gradient(90deg, var(--accent), #ffa07a);

      -webkit-background-clip: text;

      -webkit-text-fill-color: transparent;

    }



    .tagline {

      color: var(--muted);

      margin-top: 0.5rem;

      font-size: 0.95rem;

    }



    .card {

      background: var(--card);

      border-radius: 1.25rem;

      padding: 1.5rem;

      margin-bottom: 1rem;

      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);

    }



    label {

      display: block;

      font-weight: 600;

      margin-bottom: 0.5rem;

      font-size: 0.9rem;

    }



    textarea {

      width: 100%;

      padding: 0.9rem;

      border: 2px solid transparent;

      border-radius: 0.75rem;

      background: rgba(255, 255, 255, 0.08);

      color: var(--text);

      font-size: 1rem;

      resize: none;

      transition: border-color 0.2s;

    }



    textarea:focus {

      outline: none;

      border-color: var(--accent);

    }



    .char-count {

      text-align: right;

      font-size: 0.75rem;

      color: var(--muted);

      margin-top: 0.25rem;

    }



    .products {

      display: grid;

      grid-template-columns: repeat(3, 1fr);

      gap: 0.75rem;

      margin-top: 0.5rem;

    }



    .product {

      background: rgba(255, 255, 255, 0.05);

      border: 2px solid transparent;

      border-radius: 1rem;

      padding: 0.75rem;

      text-align: center;

      cursor: pointer;

      transition: all 0.2s;

    }



    .product:hover {

      background: rgba(255, 255, 255, 0.1);

      transform: translateY(-2px);

    }



    .product.selected {

      border-color: var(--accent);

      background: rgba(255, 107, 157, 0.15);

    }



    .product-img {

      width: 60px;

      height: 60px;

      border-radius: 50%;

      object-fit: cover;

      margin-bottom: 0.25rem;

    }



    .product-name {

      font-size: 0.7rem;

      color: var(--muted);

    }



    .btn {

      width: 100%;

      padding: 1rem;

      border: none;

      border-radius: 0.75rem;

      font-size: 1.1rem;

      font-weight: 700;

      cursor: pointer;

      transition: all 0.2s;

    }



    .btn-primary {

      background: linear-gradient(135deg, var(--accent), var(--accent2));

      color: #fff;

    }



    .btn-primary:hover {

      transform: scale(1.02);

      box-shadow: 0 4px 20px rgba(255, 107, 157, 0.4);

    }



    .btn-primary:disabled {

      opacity: 0.5;

      cursor: not-allowed;

      transform: none;

    }



    .btn-secondary {

      background: rgba(255, 255, 255, 0.1);

      color: var(--text);

      margin-top: 0.75rem;

    }



    video {

      width: 100%;

      border-radius: 0.75rem;

      background: #000;

    }



    .loading {

      text-align: center;

      padding: 2rem;

    }



    .spinner {

      width: 48px;

      height: 48px;

      border: 4px solid rgba(255, 255, 255, 0.2);

      border-top-color: var(--accent);

      border-radius: 50%;

      animation: spin 0.8s linear infinite;

      margin: 0 auto 1rem;

    }



    @keyframes spin {

      to {

        transform: rotate(360deg);

      }

    }



    .progress-text {

      color: var(--muted);

      font-size: 0.9rem;

      margin-top: 0.5rem;

    }



    .error {

      background: rgba(255, 100, 100, 0.2);

      padding: 1rem;

      border-radius: 0.75rem;

      color: #ff9999;

      text-align: center;

    }



    .hidden {

      display: none !important;

    }

  </style>

</head>



<body>

  <div class="container">

    <header>

      <div class="logo">🧶✨</div>

      <h1>Crochet Friends</h1>

      <p class="tagline">Create a personalized message from your crocheted friend!</p>

    </header>



    <form id="form">

      <div class="card">

        <label for="message">Your Message</label>

        <textarea id="message" rows="4" maxlength="200"

          placeholder="Happy Birthday, Tim! I hope this little potato makes you smile!" required></textarea>

        <div class="char-count"><span id="charCount">0</span>/200</div>

      </div>



      <div class="card">

        <label>Choose Your Friend</label>

        <div class="products" id="products">

          <div class="product selected" data-product="potato">

            <img src="images/potato.jpg" alt="Potato" class="product-img"

              onerror="this.outerHTML='<div class=product-emoji>🥔</div>'">

            <div class="product-name">Potato</div>

          </div>

          <div class="product" data-product="avocado">

            <div class="product-emoji" style="font-size:2.5rem">🥑</div>

            <div class="product-name">Avocado</div>

          </div>

          <div class="product" data-product="strawberry">

            <div class="product-emoji" style="font-size:2.5rem">🍓</div>

            <div class="product-name">Strawberry</div>

          </div>

        </div>

      </div>



      <button type="submit" class="btn btn-primary" id="generateBtn">✨ Create Video Message</button>

    </form>



    <div id="loading" class="card hidden">

      <div class="loading">

        <div class="spinner"></div>

        <p>Creating your magical video...</p>

        <p class="progress-text" id="progressText">This takes about 20-30 seconds</p>

      </div>

    </div>



    <div id="result" class="card hidden">

      <video id="video" controls playsinline autoplay></video>

      <a id="downloadBtn" class="btn btn-primary"

        style="display:block; text-align:center; text-decoration:none; margin-top:1rem;">📥 Download Video</a>

      <button type="button" class="btn btn-secondary" onclick="reset()">Create Another</button>

    </div>



    <div id="error" class="card error hidden">

      <p id="errorText">Oops! Something went wrong. Please try again.</p>

      <button type="button" class="btn btn-secondary" onclick="reset()">Try Again</button>

    </div>

  </div>



  <script>
    const form = document.getElementById('form');
    const message = document.getElementById('message');
    const charCount = document.getElementById('charCount');
    const progressText = document.getElementById('progressText');
    const products = document.querySelectorAll('.product');
    let selectedProduct = 'potato';

    message.addEventListener('input', () => charCount.textContent = message.value.length);

    products.forEach(p => p.addEventListener('click', () => {
      products.forEach(x => x.classList.remove('selected'));
      p.classList.add('selected');
      selectedProduct = p.dataset.product;
    }));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = message.value.trim();
      if (!text) return;
      document.getElementById('form').classList.add('hidden');
      document.getElementById('loading').classList.remove('hidden');
      progressText.textContent = 'Starting video generation...';
      try {
        const startRes = await fetch('/api/generate-video', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, character: selectedProduct })
        });
        const startData = await startRes.json();
        if (!startRes.ok) throw new Error(startData.error || 'Failed to start generation');
        const operationId = startData.operationId;
        progressText.textContent = 'Video is being created...';
        let videoUrl = null;
        let attempts = 0;
        const maxAttempts = 60;
        while (!videoUrl && attempts < maxAttempts) {
          await new Promise(r => setTimeout(r, 5000));
          attempts++;
          progressText.textContent = `Creating magic... (${attempts * 5}s)`;
          const statusRes = await fetch(`/api/check-status?operationId=${encodeURIComponent(operationId)}`);
          const statusData = await statusRes.json();
          if (!statusRes.ok) continue;
          if (statusData.status === 'done') { videoUrl = statusData.videoUrl; }
          else if (statusData.status === 'error') { throw new Error(statusData.error || 'Video generation failed'); }
        }
        if (!videoUrl) throw new Error('Video generation timed out after 5 minutes');
        document.getElementById('video').src = videoUrl;
        document.getElementById('downloadBtn').href = videoUrl;
        document.getElementById('downloadBtn').download = `crochet-${selectedProduct}-message.mp4`;
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('result').classList.remove('hidden');
      } catch (err) {
        console.error(err);
        document.getElementById('errorText').textContent = err.message || 'Something went wrong.';
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('error').classList.remove('hidden');
      }
    });

    function reset() {
      ['loading', 'result', 'error'].forEach(id => document.getElementById(id).classList.add('hidden'));
      document.getElementById('form').classList.remove('hidden');
    }
  </script>

</body>



</html>
