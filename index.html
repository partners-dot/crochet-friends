<!DOCTYPE html>      <button type="button" class="btn btn-secondary" onclick="reset()">Try Again</button>    </div>  </div>  <script>    const form = document.getElementById('form');    const message = document.getElementById('message');    const charCount = document.getElementById('charCount');    const progressText = document.getElementById('progressText');    const products = document.querySelectorAll('.product');    let selectedProduct = 'potato';    message.addEventListener('input', () => charCount.textContent = message.value.length);    products.forEach(p => p.addEventListener('click', () => {      products.forEach(x => x.classList.remove('selected'));      p.classList.add('selected');      selectedProduct = p.dataset.product;    }));    form.addEventListener('submit', async (e) => {      e.preventDefault();      const text = message.value.trim();      if (!text) return;      document.getElementById('form').classList.add('hidden');      document.getElementById('loading').classList.remove('hidden');              try {
            const res = await fetch('/api/generate-video', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text, character: selectedProduct })
            });

            const initialData = await res.json();
            if (!res.ok) throw new Error(initialData.error || 'Generation failed');

            const operationId = initialData.operationId;
            let videoUrl = null;

            // Polling logic
            while (!videoUrl) {
                await new Promise(r => setTimeout(r, 3000));
                const statusRes = await fetch(`/api/check-status?operationId=${encodeURIComponent(operationId)}`);
                const statusData = await statusRes.json();
                
                if (statusData.status === 'done') {
                    videoUrl = statusData.videoUrl;
                } else if (statusData.status === 'error') {
                    throw new Error(statusData.error || 'Generation failed during polling');
                }
            }

            document.getElementById('video').src = videoUrl;
            document.getElementById('downloadBtn').href = videoUrl;
            document.getElementById('downloadBtn').download = `crochet-${selectedProduct}-message.mp4`;
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('result').classList.remove('hidden');
        } catch (err) {        console.error(err);        document.getElementById('errorText').textContent = err.message || 'Something went wrong. Please try again.';        document.getElementById('loading').classList.add('hidden');        document.getElementById('error').classList.remove('hidden');      }    });    function reset() {      ['loading', 'result', 'error'].forEach(id => document.getElementById(id).classList.add('hidden'));      document.getElementById('form').classList.remove('hidden');    }    // Update progress text while waiting    let dots = 0;    setInterval(() => {      if (!document.getElementById('loading').classList.contains('hidden')) {        dots = (dots + 1) % 4;        progressText.textContent = 'Creating magic' + '.'.repeat(dots + 1);      }    }, 500);  </script></body></html>
