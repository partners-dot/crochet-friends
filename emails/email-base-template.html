<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Got You A Little Something - Email</title>
    <!-- Import elegant fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@400;500;600&display=swap"
        rel="stylesheet">

    <style>
        /* Essential reset for email clients */
        body,
        table,
        td,
        p,
        a {
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }

        table,
        td {
            mso-table-lspace: 0pt;
            mso-table-rspace: 0pt;
        }

        img {
            -ms-interpolation-mode: bicubic;
            border: 0;
            line-height: 100%;
            outline: none;
            text-decoration: none;
        }

        table {
            border-collapse: collapse !important;
        }
    </style>
</head>

<body style="margin: 0; padding: 0; background-color: #F4F1EA; text-align: center;">
    <table width="100%" cellpadding="0" cellspacing="0" border="0"
        style="background-color: #F4F1EA; padding: 40px 15px;" align="center">
        <tr>
            <td align="center" valign="top" style="background-color: #F4F1EA; padding: 12px;">
                <!-- MAIN WHITE CARD STRUCTURE -->
                <!-- The border and max-width logic ensures it looks like a contained card on desktop, 
                     and has a subtle frame on mobile edge-to-edge screens -->
                <table width="100%" cellpadding="0" cellspacing="0" border="0"
                    style="background-color: #FFFFFF; max-width: 500px; border-radius: 12px; border: 2px solid #D8D3C8; box-shadow: 0 10px 40px rgba(20,20,68,0.03); overflow: hidden;"
                    align="center">

                    <!-- BRAND LOGO TEXT (Header) -->
                    <tr>
                        <td align="center" style="padding: 40px 30px 8px; text-align: center;">
                            <p align="center"
                                style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-size: 16px; color: #141444; font-style: italic; font-weight: 500; letter-spacing: 0.5px; text-align: center;">
                                Got You A Little Something
                            </p>
                        </td>
                    </tr>

                    <!-- ========================================== -->
                    <!-- INJECT NEW EMAIL CONTENT MODULES HERE -->
                    <!-- ========================================== -->

                    <!-- Example Hero Module -->
                    <tr>
                        <td align="center" style="padding: 12px 25px 14px; text-align: center;">
                            <p align="center"
                                style="margin: 0 0 8px; color: #AE8D4B; font-size: 26px; font-weight: 400; line-height: 1.2; font-family: 'Playfair Display', Georgia, serif; text-align: center;">
                                &#10024; Your Headline Here
                            </p>
                            <p align="center"
                                style="margin: 0; color: #8A8A9D; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 3px; font-family: 'Montserrat', Arial, sans-serif; text-align: center;">
                                VERY SMALL SUBTITLE
                            </p>
                        </td>
                    </tr>

                    <!-- Example Button Module -->
                    <tr>
                        <td align="center" style="padding: 0 30px 32px; text-align: center;">
                            <table cellpadding="0" cellspacing="0" border="0" align="center">
                                <tr>
                                    <td align="center"
                                        style="background-color: #141444; border-radius: 4px; padding: 0;">
                                        <a href="#"
                                            style="display: block; color: #FFFFFF; text-decoration: none; padding: 18px 45px; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 2px; font-family: 'Montserrat', Arial, sans-serif; white-space: nowrap; text-align: center;">
                                            Primary CTA
                                        </a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- ========================================== -->
                    <!-- END INJECTED CONTENT -->
                    <!-- ========================================== -->

                </table>
            </td>
        </tr>

        <!-- FOOTER -->
        <tr>
            <td align="center" style="padding: 30px 20px;">
                <p align="center"
                    style="margin: 0 0 10px; color: #BDBDB5; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; font-family: 'Montserrat', Arial, sans-serif; text-align: center;">
                    &copy; Got You A Little Something
                </p>
                <p align="center"
                    style="margin: 0; color: #C8C8C0; font-size: 11px; font-style: italic; font-family: 'Playfair Display', Georgia, serif; text-align: center;">
                    Made with love for gift-givers everywhere
                </p>
            </td>
        </tr>
    </table>
</body>

</html>
