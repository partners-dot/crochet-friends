<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Video is Ready! | Got You A Little Something</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600;700&display=swap"
        rel="stylesheet">
    <!-- PostHog Analytics -->
    <script>

            capture_pageleave: true

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0a0a2e 0%, #1a1a4e 50%, #0d0d35 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
        }

        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .logo {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: #ffd166;
            margin-bottom: 1rem;
            text-shadow: 0 2px 10px rgba(255, 209, 102, 0.3);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 2rem;
            font-size: 1rem;
            line-height: 1.5;
        }

        .video-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        video {
            width: 100%;
            border-radius: 16px;
            background: #000;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ffd166 0%, #f4a942 100%);
            color: #1a1a4e;
            box-shadow: 0 8px 25px rgba(255, 209, 102, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(255, 209, 102, 0.4);
        }

        .btn-cta {
            padding: 1.4rem 3rem;
            font-size: 1.25rem;
            font-weight: 700;
            border: none;
            animation: subtle-glow 2.5s ease-in-out infinite;
            background-clip: padding-box;
        }

        @keyframes subtle-glow {

            0%,
            100% {
                box-shadow: 0 8px 25px rgba(255, 209, 102, 0.4);
            }

            50% {
                box-shadow: 0 8px 35px rgba(255, 209, 102, 0.6), 0 0 20px rgba(255, 209, 102, 0.3);
            }
        }

        .divider {
            display: none;
        }

        .review-section {
            background: rgba(255, 100, 0, 0.25) !important;
            border-radius: 4px;
            padding: 2rem;
            margin-top: 1.5rem;
            border: 1px solid #ff9f1c;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .review-section h3 {
            color: #ff9f1c;
            font-size: 1.3rem;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .review-section p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            line-height: 1.6;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .review-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(180deg, #ff9f1c 0%, #e85d04 100%);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(232, 93, 4, 0.3);
            transition: all 0.3s ease;
        }

        .review-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }

        /* Post-share: pulse the review card to draw the eye without replacing the page. */
        @keyframes reviewPulse {
            0%   { transform: scale(1);    box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
            30%  { transform: scale(1.04); box-shadow: 0 0 0 4px rgba(255,159,28,0.5), 0 8px 30px rgba(232,93,4,0.4); }
            60%  { transform: scale(1);    box-shadow: 0 0 0 3px rgba(255,159,28,0.35); }
            100% { transform: scale(1);    box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        }
        .review-pulse { animation: reviewPulse 1.4s ease-in-out 2; }

        .error-state {
            text-align: center;
            padding: 3rem 1rem;
        }

        .error-state h2 {
            margin-bottom: 1rem;
            color: #ff6b6b;
        }

        .error-state a {
            color: #ffd166;
        }

        .footer {
            margin-top: 2rem;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.8rem;
        }

        .confetti-emoji {
            display: inline-block;
            animation: bounce 1s ease-in-out infinite;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        .tip-box {
            background: rgba(255, 209, 102, 0.1);
            border: 1px solid rgba(255, 209, 102, 0.3);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.9);
        }

        .tip-box strong {
            color: #ffd166;
        }
    </style>
</head>

<body>
    <div class="container" id="content">
        <!-- Content will be loaded by JavaScript -->
    </div>

    <script>
        let videoData = null;

        function getOperationId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        // logFunnel: write one row to Supabase log_video_funnel_events (agent source of truth).
        // phase=preview. role resolves server-side from video_sessions via operationId.
        function logFunnel(event, { source = null, properties = {} } = {}) {
            try {
                fetch('/api/track', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        event, phase: 'preview',
                        role: (videoData?.userType === 'buyer' || videoData?.userType === 'receiver') ? videoData.userType : 'unknown',
                        operationId: getOperationId(), product: videoData?.product || null,
                        source, properties
                    })
                }).catch(() => { });
            } catch (e) { /* never block */ }
        }

        async function fetchVideoFromDb(operationId) {
            try {
                const res = await fetch(`/api/get-video?id=${encodeURIComponent(operationId)}`);
                if (!res.ok) return null;
                const data = await res.json();
                return {
                    videoUrl: data.videoUrl,
                    userType: data.userType || 'receiver',
                    product: data.product,
                    sku: data.sku || null
                };
            } catch (err) {
                console.error('Failed to fetch video:', err);
                return null;
            }
        }

        function getShareUrl() {
            const operationId = getOperationId();
            const baseUrl = window.location.origin;
            return `${baseUrl}/video.html?id=${operationId}`;
        }

        function renderBuyerPreview(videoUrl) {
            // BUYER created the video - preview before sharing with recipient
            const container = document.getElementById('content');
            container.innerHTML = `
                <div class="logo">Got You A Little Something</div>
                <h1><span class="confetti-emoji">🎉</span> Your Video is<br>Ready to Share!</h1>
                <p class="subtitle">Preview your video below. If it's perfect, send it off! If not, you can easily tweak the script <a href="/" style="color: #ffd166;">here</a>.<br><small style="opacity: 0.7; font-size: 0.85em;">(Each user can create up to 2 free videos)</small></p>
                
                <div class="video-container">
                    <video id="video" controls autoplay playsinline>
                        <source src="${videoUrl}" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </div>
                
                <div class="buttons">
                    <button onclick="shareVideo()" class="btn btn-primary btn-cta">
                        📤 Send My Gift Message
                    </button>
                </div>
                
                <hr class="divider">
                
                <div class="review-section">
                    <h3>⭐ Made You Smile?</h3>
                    <p>We would really appreciate a quick review - it only takes 30 seconds. Thank You! ❤️</p>
                    <a href="#" target="_blank" class="review-btn" id="reviewLinkBuyer" onclick="trackReviewClick('video_preview_buyer')">
                        Leave a Review ⭐
                    </a>
                </div>
                
                <p class="footer">Made with 💛 by Got You A Little Something</p>
            `;
        }

        function renderReceiverPreview(videoUrl) {
            // RECEIVER created the video - preview before sharing with gift-giver
            const container = document.getElementById('content');
            container.innerHTML = `
                <div class="logo">Got You A Little Something</div>
                <h1><span class="confetti-emoji">💝</span> Your Thank-You Video is Ready!</h1>
                <p class="subtitle">Preview your video below. If it's perfect, send it off! If not, you can easily tweak the script <a href="/" style="color: #ffd166;">here</a>.<br><small style="opacity: 0.7; font-size: 0.85em;">(Each user can create up to 2 free videos)</small></p>
                
                <div class="video-container">
                    <video id="video" controls autoplay playsinline>
                        <source src="${videoUrl}" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </div>
                
                <div class="buttons">
                    <button onclick="shareVideo()" class="btn btn-primary btn-cta">
                        Send My Thank You
                    </button>
                </div>
                
                <hr class="divider">
                
                <div class="review-section">
                    <h3>⭐ Made You Smile?</h3>
                    <p>We would really appreciate a quick review - it only takes 30 seconds. Thank You! ❤️</p>
                    <a href="#" target="_blank" class="review-btn" id="reviewLinkReceiver" onclick="trackReviewClick('video_preview_receiver')">
                        Leave a Review ⭐
                    </a>
                </div>
                
                <p class="footer">Made with 💛 by Got You A Little Something</p>
            `;
        }

        function renderError(message) {
            const container = document.getElementById('content');
            container.innerHTML = `
                <div class="error-state">
                    <h2>🎬 Video not found or not ready</h2>
                    <p>This video link seems to be broken or expired.</p>
                    <p><a href="/">Create a new video →</a></p>
                </div>
            `;
        }

        function renderLoading() {
            const container = document.getElementById('content');
            container.innerHTML = `
                <div class="logo">Got You A Little Something</div>
                <h1>⏳ Loading your video...</h1>
                <p class="subtitle">Just a moment!</p>
            `;
        }

        function trackReviewClick(source) {
            // send_instantly: review link opens Amazon (target=_blank); flush now so the
            // event isn't lost if the browser suspends this tab when focus moves away.
            if (window.posthog) posthog.capture('Amazon Review Link Clicked', {
                page: 'video_preview',
                source: source,
                user_type: videoData?.userType,
                product: videoData?.product
            }, { send_instantly: true });

            // Supabase funnel log + Klaviyo (track.js maps review_clicked → Klaviyo too).
            // New shape carries `source` (buyer vs receiver button), which the legacy
            // {operationId, action} shape dropped.
            logFunnel('review_clicked', { source });
        }

        // Resolved review URL (set in initPage from the SKU lookup). Reused by the celebration.
        let resolvedReviewUrl = 'https://www.amazon.com/review/create-review/?ie=UTF8&channel=glance-detail&asin=B0DVR6VBRR';

        // Post-share (Lever 2, non-destructive): DON'T replace the page. The video + share button
        // stay exactly where they are so nothing feels lost and people can re-share / re-watch.
        // We just confirm the share, gently scroll the existing review card into view, and pulse it.
        function highlightReviewAsk() {
            const section = document.querySelector('.review-section');
            if (!section) return;
            // Soften the heading to a post-share, higher-intent ask (the card itself stays in place).
            const h3 = section.querySelector('h3');
            if (h3 && !section.dataset.shared) h3.textContent = '🎉 Sent! Made you smile?';
            section.dataset.shared = '1';
            section.scrollIntoView({ behavior: 'smooth', block: 'center' });
            // Pulse to draw the eye, then settle.
            section.classList.remove('review-pulse'); // restart if shared twice
            void section.offsetWidth;                  // reflow so the animation can replay
            section.classList.add('review-pulse');
        }

        // Inline "Copied!" feedback on the share button — replaces the clunky alert() popup.
        function flashCopied() {
            document.querySelectorAll('[onclick="shareVideo()"]').forEach(btn => {
                if (btn.dataset.flashing) return;
                btn.dataset.flashing = '1';
                const original = btn.innerHTML;
                btn.innerHTML = '✓ Link Copied!';
                setTimeout(() => { btn.innerHTML = original; delete btn.dataset.flashing; }, 2000);
            });
        }

        async function initPage() {
            const operationId = getOperationId();

            if (!operationId) {
                renderError('No video ID provided');
                return;
            }

            renderLoading();
            videoData = await fetchVideoFromDb(operationId);

            if (videoData && videoData.videoUrl) {
                // PostHog: Track preview page view
                logFunnel('preview_opened');
                if (window.posthog) {
                    posthog.capture('Video Preview Page Opened', {
                        user_type: videoData.userType,
                        product: videoData.product
                    });
                    posthog.register({
                        'product_source': 'email_link',
                        'device_type': /Mobile|Android|iPhone/.test(navigator.userAgent) ? 'mobile' : 'desktop'
                    });
                    posthog.register_for_session({ 'current_step': 'video_preview' });
                }

                if (videoData.userType === 'buyer') {
                    renderBuyerPreview(videoData.videoUrl);
                } else {
                    renderReceiverPreview(videoData.videoUrl);
                }

                // Fetch dynamic ASIN for review link. Generic fallback (NOT a random specific product)
                // only if there's no SKU or the lookup fails.
                const DEFAULT_REVIEW_URL = 'https://www.amazon.com/review/create-review/?ie=UTF8&channel=glance-detail&asin=B0DVR6VBRR';
                let reviewUrl = DEFAULT_REVIEW_URL;
                if (videoData.sku) {
                    try {
                        const lookupRes = await fetch(`/api/product-lookup?sku=${encodeURIComponent(videoData.sku)}`);
                        if (lookupRes.ok) {
                            const lookupData = await lookupRes.json();
                            if (lookupData.amazonReviewUrl) reviewUrl = lookupData.amazonReviewUrl;
                        }
                    } catch (e) { console.log('Product lookup failed, using default ASIN'); }
                }
                resolvedReviewUrl = reviewUrl; // reused by the post-share celebration
                // Update all review links on the page
                document.querySelectorAll('.review-btn').forEach(link => link.href = reviewUrl);

            } else {
                renderError('Video not found or not ready');
            }
        }

        async function shareVideo() {
            const shareUrl = getShareUrl();

            // PostHog: Track share clicked
            if (window.posthog) posthog.capture('Share Button Clicked', {
                page: 'video_preview',
                user_type: videoData?.userType
            });
            logFunnel('share_clicked');
            // Klaviyo video_shared is marked on completion below (share_completed → track.js).

            const shareData = {
                title: videoData?.userType === 'receiver'
                    ? 'A Special Thank You For You!'
                    : 'A Special Message Just For You!',
                text: videoData?.userType === 'receiver'
                    ? 'Someone made this heartfelt thank-you video for you! 💝'
                    : 'Watch this special video message! 🎉',
                url: shareUrl
            };

            try {
                if (navigator.share) {
                    await navigator.share(shareData);
                    // PostHog: Track successful share
                    if (window.posthog) posthog.capture('Share Completed', {
                        page: 'video_preview',
                        method: 'native_share',
                        user_type: videoData?.userType,
                        product: videoData?.product
                    });
                    logFunnel('share_completed', { properties: { method: 'native_share' } });
                    highlightReviewAsk();
                } else {
                    // Fallback: copy link to clipboard
                    await navigator.clipboard.writeText(shareUrl);
                    // PostHog: Track clipboard copy
                    if (window.posthog) posthog.capture('Share Completed', {
                        page: 'video_preview',
                        method: 'clipboard_copy',
                        user_type: videoData?.userType,
                        product: videoData?.product
                    });
                    logFunnel('share_completed', { properties: { method: 'clipboard_copy' } });
                    flashCopied();
                    highlightReviewAsk();
                }
            } catch (err) {
                console.error('Share failed:', err);
                // PostHog: Track share cancelled or failed
                if (window.posthog) posthog.capture('Share Cancelled', {
                    page: 'video_preview',
                    reason: err.name === 'AbortError' ? 'user_cancelled' : 'error',
                    user_type: videoData?.userType
                });
                // Fallback if share was cancelled or failed
                try {
                    await navigator.clipboard.writeText(shareUrl);
                    if (window.posthog) posthog.capture('Share Completed', {
                        page: 'video_preview',
                        method: 'clipboard_fallback',
                        user_type: videoData?.userType,
                        product: videoData?.product
                    });
                    logFunnel('share_completed', { properties: { method: 'clipboard_fallback' } });
                    flashCopied();
                    highlightReviewAsk();
                } catch (clipErr) {
                    alert(`Share this link: ${shareUrl}`);
                }
            }
        }

        // Initialize
        initPage();
    </script>
</body>

</html>
