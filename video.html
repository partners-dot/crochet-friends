    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0a0a2e 0%, #1a1a4e 50%, #0d0d35 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
        }

        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .logo {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: #ffd166;
            margin-bottom: 1rem;
            text-shadow: 0 2px 10px rgba(255, 209, 102, 0.3);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 2rem;
            font-size: 1rem;
            line-height: 1.5;
        }

        .video-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        video {
            width: 100%;
            border-radius: 16px;
            background: #000;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ffd166 0%, #f4a942 100%);
            color: #1a1a4e;
            box-shadow: 0 8px 25px rgba(255, 209, 102, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(255, 209, 102, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .divider {
            margin: 2rem 0;
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .review-section {
            background: rgba(139, 69, 19, 0.3);
            border-radius: 16px;
            padding: 1.5rem;
            border: 2px solid #ffd166;
        }

        .review-section h3 {
            color: #ffd166;
            font-size: 1.2rem;
            margin-bottom: 0.75rem;
        }

        .review-section p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .review-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #ffd166 0%, #f4a942 100%);
            color: #1a1a4e;
            box-shadow: 0 8px 25px rgba(255, 209, 102, 0.3);
            transition: all 0.3s ease;
        }

        .review-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(255, 209, 102, 0.4);
        }

        .error-state {
            text-align: center;
            padding: 3rem 1rem;
        }

        .error-state h2 {
            margin-bottom: 1rem;
            color: #ff6b6b;
        }

        .error-state a {
            color: #ffd166;
        }

        .footer {
            margin-top: 2rem;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.8rem;
        }

        .heart-emoji {
            display: inline-block;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }
        }
    </style>
</head>

<body>
    <div class="container" id="content">
        <!-- Content will be loaded by JavaScript -->
    </div>

    <script>
        function getVideoUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('v');
        }

        function getOperationId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        async function fetchVideoFromDb(operationId) {
            try {
                const res = await fetch(`/api/get-video?id=${encodeURIComponent(operationId)}`);
                if (!res.ok) return null;
                const data = await res.json();
                return {
                    videoUrl: data.videoUrl,
                    userType: data.userType || 'receiver',
                    product: data.product
                };
            } catch (err) {
                console.error('Failed to fetch video:', err);
                return null;
            }
        }

        function renderReceiverContent(videoUrl) {
            // This is when the BUYER views the thank-you video from the receiver
            const container = document.getElementById('content');
            container.innerHTML = `
                <div class="logo">Got You A Little Something</div>
                <h1><span class="heart-emoji">💝</span> Someone Loved<br>Your Gift!</h1>
                <p class="subtitle">The lucky recipient of your gift made this special thank-you video just for you</p>
                
                <div class="video-container">
                    <video id="video" controls autoplay playsinline>
                        <source src="${videoUrl}" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </div>
                
                <div class="buttons">
                    <button onclick="shareVideo()" class="btn btn-primary">
                        📤 Share This Moment
                    </button>
                </div>
                
                <hr class="divider">
                
                <div class="review-section">
                    <h3>⭐ Help Us Grow!</h3>
                    <p>Love this experience? A quick review would mean the world to us!</p>
                    <a href="https://www.amazon.com/review/create-review?asin=B0DK1RF3TZ" target="_blank" class="review-btn">
                        Leave a Review ⭐
                    </a>
                </div>
                
                <p class="footer">Made with 💛 by Got You A Little Something</p>
            `;
        }

        function renderBuyerContent(videoUrl) {
            // This is when the RECEIVER views the video the buyer made for them
            const container = document.getElementById('content');
            container.innerHTML = `
                <div class="logo">Got You A Little Something</div>
                <h1>🎉 A Message<br>Just For You!</h1>
                <p class="subtitle">Someone special made this video to share a heartfelt message with you</p>
                
                <div class="video-container">
                    <video id="video" controls autoplay playsinline>
                        <source src="${videoUrl}" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </div>
                
                <div class="buttons">
                    <button onclick="shareVideo()" class="btn btn-primary">
                        📤 Share This Video
                    </button>
                </div>
                
                <hr class="divider">
                
                <div class="review-section">
                    <h3>⭐ Help Us Grow!</h3>
                    <p>Love this experience? A quick review would mean the world to us!</p>
                    <a href="https://www.amazon.com/review/create-review?asin=B0DK1RF3TZ" target="_blank" class="review-btn">
                        Leave a Review ⭐
                    </a>
                </div>
                
                <p class="footer">Made with 💛 by Got You A Little Something</p>
            `;
        }

        function renderError(message) {
            const container = document.getElementById('content');
            container.innerHTML = `
                <div class="error-state">
                    <h2>🎬 Video not found or not ready</h2>
                    <p>This video link seems to be broken or expired.</p>
                    <p><a href="/">Create a new video →</a></p>
                </div>
            `;
        }

        function renderLoading() {
            const container = document.getElementById('content');
            container.innerHTML = `
                <div class="logo">Got You A Little Something</div>
                <h1>⏳ Loading your video...</h1>
                <p class="subtitle">Just a moment!</p>
            `;
        }

        async function renderVideo() {
            const container = document.getElementById('content');
            const videoUrl = getVideoUrl();
            const operationId = getOperationId();

            // If we have a direct video URL (legacy support)
            if (videoUrl) {
                renderReceiverContent(videoUrl);
                return;
            }

            // If we have an operation ID, fetch from DB
            if (operationId) {
                renderLoading();
                const data = await fetchVideoFromDb(operationId);
                if (data && data.videoUrl) {
                    // Show different content based on who made the video
                    // PostHog: Track share page view
                    if (window.posthog) posthog.capture('Video Share Page Opened', { user_type: data.userType, product: data.product });
                    if (data.userType === 'buyer') {
                        // Buyer made the video -> Receiver is viewing it
                        renderBuyerContent(data.videoUrl);
                    } else {
                        // Receiver made the video -> Buyer is viewing it
                        renderReceiverContent(data.videoUrl);
                    }
                } else {
                    renderError('Video not found or not ready');
                }
                return;
            }

            // No video info provided
            renderError('No Video Found');
        }

        async function shareVideo() {
            // PostHog: Track share clicked
            if (window.posthog) posthog.capture('Share Button Clicked', { page: 'video_share' });
            const shareData = {
                title: 'A Special Thank You Video',
                text: 'Watch this heartfelt video message! 💝',
                url: window.location.href
            };

            try {
                if (navigator.share) {
                    await navigator.share(shareData);
                } else {
                    // Fallback: copy link to clipboard
                    await navigator.clipboard.writeText(window.location.href);
                    alert('Link copied to clipboard! Share it with someone special 💝');
                }
            } catch (err) {
                console.error('Share failed:', err);
            }
        }

        // Initialize
        renderVideo();
    </script>
</body>

</html>
